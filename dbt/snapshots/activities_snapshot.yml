snapshots:
  - name: activities_snapshot
    relation: source('strava','activities')
    config:
      unique_key: id
      strategy: check
      check_cols: all
      hard_deletes: invalidate
      dbt_valid_to_current: "'3000-12-31'::date"
      snapshot_meta_column_names:
        dbt_valid_from: valid_from
        dbt_valid_to: valid_to