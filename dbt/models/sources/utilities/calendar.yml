version: 2
models:

  - name: calendar
    description: General purpose date table that spans from the start of 2022 through the end of the current year.
    
    columns:
      - name: date_day
        description: Calendar date in YYYY-MM-DD format
        tests:
          - not_null
          - unique

      - name: day_name
        description: The name of the day of the week (e.g., Monday, Tuesday)

      - name: month_start
        description: The first day of the month which a date belongs to

      - name: month_end
        description: The last day of the month which a date belongs to
      
      - name: month_name
        description: The name of the month (e.g., January, February)

      - name: year_end
        description: The last day of the year which a date belongs to
      
